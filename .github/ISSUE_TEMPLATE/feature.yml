name: Feature request
description: Propose an improvement
body:
  - type: textarea
    id: need
    attributes:
      label: Player need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy, permissions, data, and platform impact
