name: Bug report
description: Report a reproducible Pocket Party Games problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform, OS, and app version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Remove player names, local addresses, tokens, fingerprints, and signing data.
