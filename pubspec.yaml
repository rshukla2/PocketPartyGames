name: pocket_party_games
description: Offline-first party games for one phone or a private local Wi-Fi room.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  audioplayers: ^6.5.1
  basic_utils: ^5.8.2
  bonsoir: ^7.1.5
  confetti: ^0.8.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^18.0.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
    - assets/fonts/OFL.txt
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 800
